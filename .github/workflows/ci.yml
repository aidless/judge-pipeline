name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: unittest
        run: python3 -m unittest discover -s tests
      - name: selftest (positive + 3 injections + missing-root)
        run: python3 -m judge_pipeline.cli selftest
